<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="sf-title sf-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="sf-title">Zero-trust secrets flow</title>
  <desc id="sf-desc">age-keygen generates an AGE keypair once. The private key is stored as a secure note in self-hosted Vaultwarden. The Bitwarden CLI fetches it into session memory only, never writing it to disk. SOPS and Age use that in-memory key to encrypt and decrypt files. Only the resulting encrypted .enc.yaml files are committed to the GitHub repo — the raw private key exists only in Vaultwarden or in memory, never on disk.</desc>

  <rect width="920" height="300" rx="10" fill="#0d1117"/>
  <text x="28" y="30" fill="#e6edf3" font-size="17" font-weight="700">Zero-trust secrets flow</text>
  <text x="28" y="49" fill="#8b949e" font-size="12">The AGE private key: generated once, vaulted, decrypted only into memory</text>

  <!-- dashed "never on disk" envelope around boxes 2-4 -->
  <rect x="186" y="66" width="555" height="118" rx="10" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>

  <!-- Box 1: age-keygen -->
  <g transform="translate(10,70)">
    <clipPath id="sf-b1"><rect width="166" height="100" rx="8"/></clipPath>
    <g clip-path="url(#sf-b1)"><rect width="166" height="100" fill="#161b22"/><rect width="166" height="24" fill="#bc8cff" opacity="0.16"/></g>
    <rect width="166" height="100" rx="8" fill="none" stroke="#30363d"/>
    <text x="10" y="16" fill="#bc8cff" font-size="11.5" font-weight="700">age-keygen</text>
    <text x="10" y="42" fill="#e6edf3" font-size="11.5">Generate AGE</text>
    <text x="10" y="58" fill="#e6edf3" font-size="11.5">keypair (once)</text>
    <text x="10" y="82" fill="#8b949e" font-size="10.5">public + private key</text>
  </g>

  <!-- Box 2: Vaultwarden -->
  <g transform="translate(195,70)">
    <clipPath id="sf-b2"><rect width="166" height="100" rx="8"/></clipPath>
    <g clip-path="url(#sf-b2)"><rect width="166" height="100" fill="#161b22"/><rect width="166" height="24" fill="#d29922" opacity="0.18"/></g>
    <rect width="166" height="100" rx="8" fill="none" stroke="#30363d"/>
    <text x="10" y="16" fill="#d29922" font-size="11.5" font-weight="700">Vaultwarden</text>
    <text x="10" y="42" fill="#e6edf3" font-size="11.5">Private key saved</text>
    <text x="10" y="58" fill="#e6edf3" font-size="11.5">as a Secure Note</text>
    <text x="10" y="82" fill="#8b949e" font-size="10.5">self-hosted, at rest</text>
  </g>

  <!-- Box 3: Bitwarden CLI -->
  <g transform="translate(380,70)">
    <clipPath id="sf-b3"><rect width="166" height="100" rx="8"/></clipPath>
    <g clip-path="url(#sf-b3)"><rect width="166" height="100" fill="#161b22"/><rect width="166" height="24" fill="#58a6ff" opacity="0.16"/></g>
    <rect width="166" height="100" rx="8" fill="none" stroke="#30363d"/>
    <text x="10" y="16" fill="#58a6ff" font-size="11.5" font-weight="700">bw (Bitwarden CLI)</text>
    <text x="10" y="42" fill="#e6edf3" font-size="11.5">Fetched into</text>
    <text x="10" y="58" fill="#e6edf3" font-size="11.5">session memory</text>
    <text x="10" y="82" fill="#8b949e" font-size="10.5">$SOPS_AGE_KEY env var</text>
  </g>

  <!-- Box 4: SOPS + Age -->
  <g transform="translate(565,70)">
    <clipPath id="sf-b4"><rect width="166" height="100" rx="8"/></clipPath>
    <g clip-path="url(#sf-b4)"><rect width="166" height="100" fill="#161b22"/><rect width="166" height="24" fill="#3fb950" opacity="0.16"/></g>
    <rect width="166" height="100" rx="8" fill="none" stroke="#30363d"/>
    <text x="10" y="16" fill="#3fb950" font-size="11.5" font-weight="700">SOPS + Age</text>
    <text x="10" y="42" fill="#e6edf3" font-size="11.5">Encrypt / decrypt</text>
    <text x="10" y="58" fill="#e6edf3" font-size="11.5">files in place</text>
    <text x="10" y="82" fill="#8b949e" font-size="10.5">using the in-memory key</text>
  </g>

  <!-- Box 5: GitHub repo -->
  <g transform="translate(750,70)">
    <clipPath id="sf-b5"><rect width="166" height="100" rx="8"/></clipPath>
    <g clip-path="url(#sf-b5)"><rect width="166" height="100" fill="#161b22"/><rect width="166" height="24" fill="#8b949e" opacity="0.18"/></g>
    <rect width="166" height="100" rx="8" fill="none" stroke="#30363d"/>
    <text x="10" y="16" fill="#c9d1d9" font-size="11.5" font-weight="700">Homelab-ops repo</text>
    <text x="10" y="42" fill="#e6edf3" font-size="11.5">Only *.enc.yaml</text>
    <text x="10" y="58" fill="#e6edf3" font-size="11.5">gets committed</text>
    <text x="10" y="82" fill="#8b949e" font-size="10.5">plaintext never leaves the laptop</text>
  </g>

  <!-- arrows -->
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#sf-arrow)">
    <path d="M176,120 H193"/>
    <path d="M361,120 H378"/>
    <path d="M546,120 H563"/>
    <path d="M731,120 H748"/>
  </g>
  <defs>
    <marker id="sf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="463" y="204" text-anchor="middle" fill="#f85149" font-size="11" font-weight="600">key exists only in the vault or in memory here — never written to disk</text>

  <text x="28" y="235" fill="#8b949e" font-size="11">After step 4, `dev-key.txt` is securely deleted from the laptop — nothing to leave behind.</text>
</svg>
